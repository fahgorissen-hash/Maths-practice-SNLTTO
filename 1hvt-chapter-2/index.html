<script>
/* Chapter 3 Relations - question engine (no DOM). Works in browser and in node. */
(function (root) {
  'use strict';
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const nz = (a, b) => { let v = 0; while (v === 0) v = ri(a, b); return v; };
  const f = n => (n < 0 ? '−' : '') + Math.abs(n);           // number with real minus
  const par = n => n < 0 ? '(' + f(n) + ')' : String(n);           // (−2)
  const pt = (x, y) => '(' + f(x) + ', ' + f(y) + ')';
  const linTxt = (a, b, v) => {                                    // "3x − 2"
    v = v || 'x'; let s = '';
    if (a === 1) s = v; else if (a === -1) s = '−' + v; else if (a !== 0) s = f(a) + v;
    if (b !== 0) s += (s === '' ? f(b) : (b < 0 ? ' − ' : ' + ') + Math.abs(b));
    return s === '' ? '0' : s;
  };
  const quadTxt = (a, c) => {                                      // "−x² + 3"
    let s = a === 1 ? 'x²' : a === -1 ? '−x²' : f(a) + 'x²';
    if (c !== 0) s += (c < 0 ? ' − ' : ' + ') + Math.abs(c);
    return s;
  };
  const ev = (a, b, x) => a * x + b;
  const subStep = (a, b, x, v) => {
    v = v || 'x';
    let s = a === 0 ? '' : (a === 1 ? par(x) : a === -1 ? '−' + par(x) : f(a) + ' · ' + par(x));
    if (b !== 0) s += (s === '' ? f(b) : (b < 0 ? ' − ' : ' + ') + Math.abs(b));
    return s + ' = ' + f(ev(a, b, x));
  };
  const tbl = (xs, ys, xl, yl) => {
    let h = '<table class="tbl"><tr><th>' + (xl || 'x') + '</th>' + xs.map(x => '<td>' + f(x) + '</td>').join('') + '</tr>';
    h += '<tr><th>' + (yl || 'y') + '</th>' + ys.map(y => '<td>' + (y === null ? '?' : f(y)) + '</td>').join('') + '</tr></table>';
    return h;
  };

  /* ---------- SVG grid ---------- */
  let gid = 0;
  function grid(o) {
    const u = 26, pad = 24, xmin = o.xmin, xmax = o.xmax, ymin = o.ymin, ymax = o.ymax;
    const w = (xmax - xmin) * u + 2 * pad, h = (ymax - ymin) * u + 2 * pad;
    const X = x => pad + (x - xmin) * u, Y = y => pad + (ymax - y) * u;
    const id = 'c' + (++gid);
    let s = '<svg class="grid" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="grid"' +
      (o.click ? ' data-click="1" data-xmin="' + xmin + '" data-ymax="' + ymax + '" data-u="' + u + '" data-pad="' + pad + '" data-w="' + w + '"' : '') + '>';
    s += '<defs><clipPath id="' + id + '"><rect x="' + X(xmin) + '" y="' + Y(ymax) + '" width="' + (xmax - xmin) * u + '" height="' + (ymax - ymin) * u + '"/></clipPath></defs>';
    s += '<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="#fff"/>';
    for (let x = xmin; x <= xmax; x++) s += '<line x1="' + X(x) + '" y1="' + Y(ymin) + '" x2="' + X(x) + '" y2="' + Y(ymax) + '" stroke="#dbe3ea" stroke-width="1"/>';
    for (let y = ymin; y <= ymax; y++) s += '<line x1="' + X(xmin) + '" y1="' + Y(y) + '" x2="' + X(xmax) + '" y2="' + Y(y) + '" stroke="#dbe3ea" stroke-width="1"/>';
    if (!o.plain) {
    s += '<line x1="' + X(xmin) + '" y1="' + Y(0) + '" x2="' + X(xmax) + '" y2="' + Y(0) + '" stroke="#334" stroke-width="1.6"/>';
    s += '<line x1="' + X(0) + '" y1="' + Y(ymin) + '" x2="' + X(0) + '" y2="' + Y(ymax) + '" stroke="#334" stroke-width="1.6"/>';
    s += '<text x="' + (X(xmax) + 4) + '" y="' + (Y(0) + 4) + '" font-size="12" font-style="italic" fill="#334">x</text>';
    s += '<text x="' + (X(0) + 6) + '" y="' + (Y(ymax) - 8) + '" font-size="12" font-style="italic" fill="#334">y</text>';
    const stx = xmax - xmin > 16 ? 2 : 1, sty = ymax - ymin > 16 ? 2 : 1;
    for (let x = xmin; x <= xmax; x++) if (x !== 0 && x % stx === 0) s += '<text x="' + X(x) + '" y="' + (Y(0) + 14) + '" font-size="10" text-anchor="middle" fill="#556">' + f(x) + '</text>';
    for (let y = ymin; y <= ymax; y++) if (y !== 0 && y % sty === 0) s += '<text x="' + (X(0) - 5) + '" y="' + (Y(y) + 3.5) + '" font-size="10" text-anchor="end" fill="#556">' + f(y) + '</text>';
    }
    (o.curves || []).forEach(c => {
      let d = '', pen = false;
      for (let x = xmin; x <= xmax + 1e-9; x += 0.05) {
        const y = c.f(x);
        if (y < ymin - 2 || y > ymax + 2) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1); pen = true;
      }
      s += '<path d="' + d + '" fill="none" stroke="' + (c.color || '#d1471f') + '" stroke-width="2.4" clip-path="url(#' + id + ')"/>';
    });
    (o.polys || []).forEach(p => {
      s += '<polygon points="' + p.v.map(q => X(q[0]) + ',' + Y(q[1])).join(' ') + '" fill="' + (p.fill || 'rgba(27,95,168,.12)') + '" stroke="' + (p.color || '#1b5fa8') + '" stroke-width="2"/>';
      if (p.label) p.v.forEach((q, i) => { s += '<text x="' + (X(q[0]) + 7) + '" y="' + (Y(q[1]) - 7) + '" font-size="13" font-weight="700" fill="#123">' + p.label[i] + '</text>'; });
    });
    (o.segs || []).forEach(g => {
      s += '<line x1="' + X(g.a[0]) + '" y1="' + Y(g.a[1]) + '" x2="' + X(g.b[0]) + '" y2="' + Y(g.b[1]) + '" stroke="' + (g.color || '#d1471f') + '" stroke-width="' + (g.w || 2.4) + '"' + (g.dash ? ' stroke-dasharray="6 5"' : '') + '/>';
      if (g.label) s += '<text x="' + (X(g.b[0]) + 6) + '" y="' + (Y(g.b[1]) - 6) + '" font-size="14" font-weight="700" fill="' + (g.color || '#d1471f') + '">' + g.label + '</text>';
    });
    (o.pts || []).forEach(p => {
      s += '<circle cx="' + X(p.x) + '" cy="' + Y(p.y) + '" r="4.6" fill="' + (p.color || '#1b5fa8') + '" stroke="#fff" stroke-width="1.2"/>';
      if (p.label) s += '<text x="' + (X(p.x) + 7) + '" y="' + (Y(p.y) - 7) + '" font-size="13" font-weight="700" fill="#123">' + p.label + '</text>';
    });
    s += '<g class="marks"></g></svg>';
    return s;
  }

  /* ---------- Question builders. Each returns a question object ----------
     type: num | multi | point | choice | click
     correct: a right answer in "user format" (used by tests)                  */
  const G = {};   // section id -> array of generators (lvl)=>Q

  /* ---------- helpers for plane figures ---------- */
  const MIR = '#d1471f', ptc = '#1b5fa8';
  const rad = d => d * Math.PI / 180;
  function angleSvg(deg, rot, lab) {
    const vx = 110, vy = 100, L = 85, r = 26, p1 = rad(rot), p2 = rad(rot + deg);
    const P = (a, d) => (vx + d * Math.cos(a)).toFixed(1) + ' ' + (vy - d * Math.sin(a)).toFixed(1);
    let s = '<svg class="grid" viewBox="0 0 220 200" style="max-width:260px" role="img" aria-label="an angle"><rect width="220" height="200" fill="#fff"/>';
    s += '<path d="M' + P(p1, L) + ' L' + vx + ' ' + vy + ' L' + P(p2, L) + '" fill="none" stroke="#223" stroke-width="2.4" stroke-linecap="round"/>';
    if (deg >= 359.9) s += '<circle cx="' + vx + '" cy="' + vy + '" r="' + r + '" fill="none" stroke="' + MIR + '" stroke-width="2.4"/>';
    else if (Math.abs(deg - 90) < 0.01) { const a = P(p1, 16), b = P(p1 + 0, 0); s += '<path d="M' + P(p1, 16) + ' L' + (vx + 16 * Math.cos(p1) + 16 * Math.cos(p2)).toFixed(1) + ' ' + (vy - 16 * Math.sin(p1) - 16 * Math.sin(p2)).toFixed(1) + ' L' + P(p2, 16) + '" fill="none" stroke="' + MIR + '" stroke-width="2.4"/>'; }
    else s += '<path d="M' + P(p1, r) + ' A' + r + ' ' + r + ' 0 ' + (deg > 180 ? 1 : 0) + ' 0 ' + P(p2, r) + '" fill="none" stroke="' + MIR + '" stroke-width="2.4"/>';
    s += '<circle cx="' + vx + '" cy="' + vy + '" r="3.5" fill="#223"/>';
    if (lab) s += '<text x="' + (vx + 8) + '" y="' + (vy + 18) + '" font-size="14" font-weight="700" fill="#123">' + lab + '</text>';
    return s + '</svg>';
  }
  /* ---------- protractor ---------- */
  function protractor(o) {
    const W = 380, H = 214, cx = 190, cy = 188, R = 160, start = o.start || 'R';
    const A = d => d * Math.PI / 180, X = (d, r) => (cx + r * Math.cos(A(d))).toFixed(1), Y = (d, r) => (cy - r * Math.sin(A(d))).toFixed(1);
    let s = '<svg class="proto grid" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="protractor"' + (o.click ? ' data-proto="1" data-w="' + W + '" data-h="' + H + '" data-cx="' + cx + '" data-cy="' + cy + '" data-r="' + R + '"' : '') + ' style="max-width:520px;cursor:' + (o.click ? 'crosshair' : 'default') + '">';
    s += '<rect width="' + W + '" height="' + H + '" fill="#fff"/>';
    s += '<path d="M' + (cx - R) + ' ' + cy + ' A' + R + ' ' + R + ' 0 0 1 ' + (cx + R) + ' ' + cy + ' Z" fill="rgba(80,170,230,.14)" stroke="#2b6fa3" stroke-width="1.6"/>';
    s += '<path d="M' + (cx - 40) + ' ' + cy + ' A40 40 0 0 1 ' + (cx + 40) + ' ' + cy + '" fill="none" stroke="#9cc4e4" stroke-width="1"/>';
    for (let d = 0; d <= 180; d++) {
      const len = d % 10 === 0 ? 16 : d % 5 === 0 ? 11 : 6;
      s += '<line x1="' + X(d, R) + '" y1="' + Y(d, R) + '" x2="' + X(d, R - len) + '" y2="' + Y(d, R - len) + '" stroke="#2b6fa3" stroke-width="' + (d % 10 === 0 ? 1.3 : 0.8) + '"/>';
      if (d % 10 === 0) {
        s += '<text x="' + X(d, R - 27) + '" y="' + (+Y(d, R - 27) + 3.5) + '" font-size="10.5" text-anchor="middle" fill="#123" font-weight="700">' + d + '</text>';
        s += '<text x="' + X(d, R - 44) + '" y="' + (+Y(d, R - 44) + 3.5) + '" font-size="9" text-anchor="middle" fill="#5b6b7a">' + (180 - d) + '</text>';
      }
    }
    s += '<line x1="' + (cx - R - 12) + '" y1="' + cy + '" x2="' + (cx + R + 12) + '" y2="' + cy + '" stroke="#2b6fa3" stroke-width="1"/>';
    const base = start === 'R' ? 0 : 180;
    s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + X(base, R + 22) + '" y2="' + Y(base, R + 22) + '" stroke="' + MIR + '" stroke-width="3.4" stroke-linecap="round"/>';
    if (o.arm !== undefined) {
      const a = o.arm;
      const lo = Math.min(base, a), hi = Math.max(base, a);
      s += '<path d="M' + X(lo, 62) + ' ' + Y(lo, 62) + ' A62 62 0 0 0 ' + X(hi, 62) + ' ' + Y(hi, 62) + '" fill="none" stroke="' + MIR + '" stroke-width="0" />';
      s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + X(a, R + 22) + '" y2="' + Y(a, R + 22) + '" stroke="#223" stroke-width="3" stroke-linecap="round"/>';
    }
    if (o.arm2 !== undefined) s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + X(o.arm2, R + 22) + '" y2="' + Y(o.arm2, R + 22) + '" stroke="#1b5fa8" stroke-width="3" stroke-linecap="round"/>';
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#223"/><g class="pm"></g></svg>';
    return s;
  }
  const gr = (o) => grid(Object.assign({ xmin: -7, xmax: 7, ymin: -7, ymax: 7 }, o));
  const grp = (o) => gr(Object.assign({ plain: true }, o));
  const inR = (p, r) => Math.abs(p[0]) <= r && Math.abs(p[1]) <= r;
  const clickQ = (html, targets, hint, steps, extra) => Object.assign({ type: 'click', targets, correct: targets, html, hint, steps }, extra || {});
  const revLine = (P, e) => {            // full line through P with primitive direction e, plus lattice points on it
    const pts = [], R = 7; let k = 0;
    while (Math.abs(P[0] + (k + 1) * e[0]) <= R && Math.abs(P[1] + (k + 1) * e[1]) <= R) k++;
    let j = 0; while (Math.abs(P[0] - (j + 1) * e[0]) <= R && Math.abs(P[1] - (j + 1) * e[1]) <= R) j++;
    for (let t = -j; t <= k; t++) pts.push([P[0] + t * e[0], P[1] + t * e[1]]);
    return { seg: { a: pts[0], b: pts[pts.length - 1] }, pts };
  };
  const NAMES = ['A', 'B', 'C', 'D', 'E', 'F', 'K', 'L', 'M', 'P', 'Q', 'R', 'S', 'T'];

  /* 2.1 Lines and distances */
  G['2.1'] = [
    function nameIt(l) {
      const items = [
        ['A line goes on for ever in both directions. It has no starting point and no end point.', 'Line'],
        ['It has one end point and goes on for ever in one direction.', 'Ray'],
        ['It has two end points. You can measure its length.', 'Line segment'],
        ['Two lines that never meet, because they stay at the same distance from each other.', 'Parallel lines'],
        ['Two lines that meet at an angle of 90°.', 'Perpendicular lines']
      ];
      const it = pick(items), opts = ['Line', 'Ray', 'Line segment', 'Parallel lines', 'Perpendicular lines'].slice(0, l === 0 ? 3 : 5);
      const pool = l === 0 ? items.slice(0, 3) : items; const q = pick(pool);
      return { type: 'choice', opts, ans: opts.indexOf(q[1]), correct: opts.indexOf(q[1]), html: '<p>Which word fits? <i>' + q[0] + '</i></p>',
        hint: 'Think about the end points: none, one or two. Or about the angle between two lines.', steps: q[1] + '.' };
    },

  if(test){return testCheck(q,u)}
  const ok=E.grade(q,u);tries++;
  const S=st.stat[st.sec]=st.stat[st.sec]||{n:0,ok:0};
  if(ok){
    done=true;st.prog[st.sec]=(st.prog[st.sec]||0)+1;S.n++;if(tries===1)S.ok++;
    if(tries===1){streak++;wrongRun=0}
    let up='';
    if(!mix&&streak>=3){streak=0;
      if(lvl()<3){st.lvl[st.sec]=lvl()+1;st.best[st.sec]=Math.max(st.best[st.sec]||0,lvl());up=' <b>Level up: '+LV[lvl()]+'!</b>'+(lvl()===3?' These are challenge questions.':'')}
      else if(!st.done[st.sec]){st.done[st.sec]=true;up=' <b>Extra spicy completed! ★ Master Mix is now unlocked for this section (see the menu).</b>'}}
    save();fb('ok','<b class="h">Correct!'+(tries>1?' (second try)':'')+'</b>'+q.steps+up);finish();
  }else if(tries===1){
    streak=0;fb('no','<b class="h">Not yet. Try again.</b>'+(q.hint?q.hint:''));
  }else{
    done=true;wrongRun++;S.n++;let dn='';
    if(!mix&&wrongRun>=2&&lvl()>0){st.lvl[st.sec]=lvl()-1;wrongRun=0;dn=' <i>Next questions will be a bit easier.</i>'}
    save();fb('no','<b class="h">The answer is: '+E.answerText(q)+'</b>'+q.steps+dn);finish();
  }
}
function wireProto(){
  const sv=document.querySelector('svg.proto[data-proto]');if(!sv)return;
  sv.addEventListener('click',ev=>{if(done)return;
    const r=sv.getBoundingClientRect(),W=+sv.dataset.w,H=+sv.dataset.h,cx=+sv.dataset.cx,cy=+sv.dataset.cy,R=+sv.dataset.r;
    const px=(ev.clientX-r.left)*W/r.width,py=(ev.clientY-r.top)*H/r.height;
    let a=Math.atan2(cy-py,px-cx)*180/Math.PI;if(py>cy)a=px>=cx?0:180;a=Math.max(0,Math.min(180,Math.round(a)));protoAngle=a;
    const t=a*Math.PI/180,x2=cx+(R+22)*Math.cos(t),y2=cy-(R+22)*Math.sin(t),xd=cx+R*Math.cos(t),yd=cy-R*Math.sin(t);
    sv.querySelector('.pm').innerHTML='<line x1="'+cx+'" y1="'+cy+'" x2="'+x2+'" y2="'+y2+'" stroke="#223" stroke-width="3" stroke-linecap="round"/><circle cx="'+xd+'" cy="'+yd+'" r="6" fill="#d1471f" stroke="#fff" stroke-width="1.5"/>';
  });
}
function revealQ(q){
  if(q.type==='proto'){const sv=document.querySelector('svg.proto');if(!sv||sv.querySelector('.rev'))return;const cx=+190,cy=188,R=160,t=q.target*Math.PI/180;
    sv.insertAdjacentHTML('beforeend','<g class="rev"><line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+(R+22)*Math.cos(t))+'" y2="'+(cy-(R+22)*Math.sin(t))+'" stroke="#16803c" stroke-width="3" stroke-dasharray="7 4"/><circle cx="'+(cx+R*Math.cos(t))+'" cy="'+(cy-R*Math.sin(t))+'" r="5.5" fill="#16803c" stroke="#fff" stroke-width="1.5"/></g>');return}
  if(q.type!=='click')return;const sv=document.querySelector('svg.grid[data-click]');if(!sv||sv.querySelector('.rev'))return;
  const u=+sv.dataset.u,pad=+sv.dataset.pad,xmin=+sv.dataset.xmin,ymax=+sv.dataset.ymax,X=x=>pad+(x-xmin)*u,Y=y=>pad+(ymax-y)*u;
  const R=q.reveal||{segs:[],pts:q.targets};let h='';
  (R.segs||[]).forEach(g=>{h+='<line x1="'+X(g.a[0])+'" y1="'+Y(g.a[1])+'" x2="'+X(g.b[0])+'" y2="'+Y(g.b[1])+'" stroke="#16803c" stroke-width="2.2" stroke-dasharray="6 4" opacity=".75"/>'});
  (R.pts||[]).forEach(p=>{h+='<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="5" fill="#16803c" stroke="#fff" stroke-width="1.5"/>'});
  sv.querySelector('.marks').insertAdjacentHTML('beforebegin','<g class="rev">'+h+'</g>');
}
function finish(){revealQ(cur);$('#chk').disabled=true;$('#hnt').disabled=true;$('#nxt').style.display='';$('#nxt').focus();document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.querySelectorAll('#ans input').forEach(i=>i.disabled=true);renderNavSoft()}
function renderNavSoft(){if(items().some(s=>st.done[s.id]&&!document.querySelector('#nav .mm')))renderNav();const bars=document.querySelectorAll('#nav .bar i');items().forEach((s,i)=>{bars[i].style.width=Math.min(GOAL,st.prog[s.id]||0)*100/GOAL+'%'})}

/* ---- test preparation ---- */
function startTest(){test={qs:E.makeTest(),i:0,score:0,log:[]};renderNav();testShow()}
function testShow(){
  const q=cur=test.qs[test.i];done=false;clicked=[];choiceSel=null;protoAngle=null;
  $('#main').innerHTML='<div class="top"><span class="badge l1">Test preparation</span><span class="streak">Question '+(test.i+1)+' of '+test.qs.length+'</span></div>'+qHTML(q)+
   '<div class="btns"><button class="btn" id="chk">Check</button><button class="btn alt" id="nxt" style="display:none">'+(test.i===test.qs.length-1?'See my result':'Next question')+'</button></div><div class="fb" id="fb"></div>';
  wireProto();$('#chk').onclick=check;$('#nxt').onclick=testNext;
  const wiring=$('#hnt');
  const tmp=document.createElement('button');tmp.id='hnt';tmp.style.display='none';$('.btns').appendChild(tmp);
  document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done)return;choiceSel=+b.dataset.i;document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
  document.querySelectorAll('#ans input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')check()}));
  const sv=document.querySelector('svg.grid[data-click]');
  if(sv)sv.addEventListener('click',ev=>{if(done)return;const r=sv.getBoundingClientRect(),W=+sv.dataset.w,u=+sv.dataset.u,pad=+sv.dataset.pad;
    const x=Math.round(((ev.clientX-r.left)*W/r.width-pad)/u)+ +sv.dataset.xmin,y=+sv.dataset.ymax-Math.round(((ev.clientY-r.top)*W/r.width-pad)/u);
    const k=clicked.findIndex(p=>p[0]===x&&p[1]===y);if(k>=0)clicked.splice(k,1);else clicked.push([x,y]);drawMarks(sv)});
  const f=$('#in0');if(f)f.focus();
}
function testCheck(q,u){
  done=true;const ok=E.grade(q,u);if(ok)test.score++;revealQ(q);
  test.log.push({q,ok,u});
  fb(ok?'ok':'no',ok?'<b class="h">Correct</b>':'<b class="h">Not correct. The answer is: '+E.answerText(q)+'</b>'+q.steps);
  $('#chk').disabled=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);document.querySelectorAll('#ans input').forEach(i=>i.disabled=true);
  $('#nxt').style.display='';$('#nxt').focus();
}
function testNext(){
  test.i++;if(test.i<test.qs.length)return testShow();
  const n=test.qs.length,g=Math.round((test.score/n*9+1)*10)/10;
  const wrong=test.log.filter(x=>!x.ok);st.tests.push({d:new Date().toISOString().slice(0,10),s:test.score,n:n});st.tests=st.tests.slice(-20);save();
  $('#main').innerHTML='<div class="res"><h2>Your result</h2><div class="grade">'+test.score+' / '+n+'</div><p>That is a '+String(g).replace('.',',')+' on a scale of 1 to 10 (a rough guide only).</p>'+
   (wrong.length?'<h3>Look at these again</h3>'+wrong.map(x=>'<div class="rev"><div>'+x.q.html+'</div><div><b>Answer: '+E.answerText(x.q)+'</b></div><div class="st">'+x.q.steps+'</div></div>').join(''):'<p><b>Everything correct. Great work!</b></p>')+
   '<div class="btns"><button class="btn" id="again">Try a new test</button></div></div>';
  $('#again').onclick=startTest;
}

/* ---- progress overview ---- */
function showProgress(){
  test=null;renderNav();
  const rows=items().map(s=>{
    const cur_=st.lvl[s.id]||0,best=Math.max(st.best[s.id]||0,cur_),d=!!st.done[s.id],S=st.stat[s.id]||{n:0,ok:0};
    const chips=LV.map((l,i)=>'<span class="chip '+(d||i<best?'ach':i===cur_&&(S.n>0||cur_>0)?'act':'')+'">'+l+'</span>').join('');
    return '<tr><td><b>'+s.title+'</b></td><td>'+chips+'</td><td>'+(S.n||0)+'</td><td>'+(S.n?Math.round(S.ok*100/S.n)+'%':'–')+'</td><td>'+(d?'★ unlocked':'not yet')+'</td></tr>';
  }).join('');
  const T=st.tests.length?'<h3>Test preparation results</h3><table><tr><th>Date</th><th>Score</th></tr>'+st.tests.slice().reverse().map(t=>'<tr><td>'+t.d+'</td><td>'+t.s+' / '+t.n+'</td></tr>').join('')+'</table>':'<p>You have not done a test preparation yet.</p>';
  $('#main').innerHTML='<div class="pg"><h2>My progress ('+(st.mode==='lesson'?'by lesson':'by paragraph')+')</h2><p>Green = level reached. Blue = the level you are working on. Reach Extra spicy and answer 3 in a row correctly to unlock the Master Mix.</p><table><tr><th>'+(st.mode==='lesson'?'Lesson':'Section')+'</th><th>Levels</th><th>Questions</th><th>First try</th><th>Master Mix</th></tr>'+rows+'</table>'+T+
    '<div class="btns"><button class="btn" id="back">Back to practice</button><button class="btn alt" id="prt">Print / save as PDF</button></div></div>';
  $('#back').onclick=()=>next(true);$('#prt').onclick=()=>window.print();
}
document.getElementById('pbtn').onclick=showProgress;
window.__dbg=()=>cur;renderNav();next(true);
})();
</script>
